<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DGT - Rescate</title>
    <style>
        :root {
            --primary: #f1c40f;
            --danger: #e74c3c;
            --safe: #2ecc71;
            --bg: #34495e;
            --text: #ecf0f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: none;
            user-select: none;
        }

        body {
            background-color: #1a1a1a;
            font-family: sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 600px;
            max-height: 1000px;
            background: skyblue;
            overflow: hidden;
            box-shadow: 0 0 50px black;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            color: var(--text);
            padding: 20px;
            text-align: center;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        button {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: var(--safe);
            color: white;
            cursor: pointer;
            border-bottom: 4px solid #27ae60;
        }

        button:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: white;
            z-index: 5;
            text-shadow: 1px 1px 2px black;
            font-weight: bold;
            pointer-events: none;
        }

        .fuel-container {
            width: 120px;
            height: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid white;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        #fuel-bar {
            width: 100%;
            height: 100%;
            background: var(--safe);
        }

        /* Estilos de Instrucciones Visuales */
        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            max-width: 90%;
            line-height: 1.4;
            font-size: 0.9rem;
        }

        .instructions ul {
            list-style: none;
            text-align: left;
        }

        .instructions li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .inst-img {
            width: 32px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }

        .inst-key {
            background: #eee;
            color: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="hud" class="hidden">
            <div>GASOLINA<div class="fuel-container">
                    <div id="fuel-bar"></div>
                </div>
            </div>
            <div style="text-align: right;">DISTANCIA: <span id="dist-val">0</span>m<br>RESCATES: <span
                    id="resc-val">0</span></div>
        </div>
        <div id="menu-screen" class="screen">
            <h1 style="color:var(--primary); font-size:3rem; margin-bottom:10px;">ACOMPAÑA A LA DGT</h1>
            <div class="instructions">
                <ul>
                    <li><span class="inst-key">TOCA</span> Pantalla para elevar el helicóptero.</li>
                    <li><img src="fuel.png" class="inst-img"> <b>GAS:</b> Aterriza para repostar.</li>
                    <li><img src="accident.png" class="inst-img"> <b>RECOGE:</b> Rescata heridos en accidentes.</li>
                    <li><img src="hospital.png" class="inst-img"> <b>ENTREGA:</b> Déjalos en el hospital (+).</li>
                    <li>
                        <div
                            style="width:10px; height:20px; background:linear-gradient(to right, #333, #666, #333); border-radius:2px;">
                        </div> <b>CABLES:</b> ¡Peligro! Alta tensión.
                    </li>
                </ul>
            </div>
            <button id="start-btn">EMPEZAR JUEGO</button>
        </div>
        <div id="gameover-screen" class="screen hidden">
            <h1 style="color:var(--danger);">FIN DE MISIÓN</h1>
            <div id="final-stats" style="margin:20px 0; font-size:1.2rem;"></div>
            <button id="restart-btn">REINTENTAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const STATE = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };
        let gameState = STATE.MENU;

        // ASSETS - GitHub es sensible a mayúsculas. Asegúrate de que coincidan.
        const ASSETS = {
            helicopter: new Image(), bird: new Image(), fuel: new Image(), accident: new Image(), hospital: new Image()
        };
        ASSETS.helicopter.src = 'helicoptero.png';
        ASSETS.bird.src = 'buitre.png';
        ASSETS.fuel.src = 'fuel.png';
        ASSETS.accident.src = 'accident.png';
        ASSETS.hospital.src = 'hospital.png';

        const CFG = { gravity: 0.25, lift: -5, maxSpeedY: 8, fuelDepletion: 0.08, fuelRefill: 25, baseSpeed: 3, speedInc: 0.0001 };
        let helicopter, entities, gameSpeed, score, rescues, frameCount, lastCablePos = 0;
        let fuelBar, distVal, rescVal;

        class Helicopter {
            constructor() { this.width = 80; this.height = 42; this.reset(); }
            reset() { this.x = 50; this.y = canvas.height / 2 || 100; this.dy = 0; this.fuel = 100; this.carryingCount = 0; }
            tap() { this.dy = CFG.lift; }
            update() {
                this.dy += CFG.gravity;
                if (this.dy > CFG.maxSpeedY) this.dy = CFG.maxSpeedY;
                this.y += this.dy;
                this.fuel -= CFG.fuelDepletion;
                if (this.y < 0) { this.y = 0; this.dy = 0; }
                if (this.y + this.height > canvas.height || this.fuel <= 0) gameOver(this.fuel <= 0 ? "Sin gasolina" : "¡Chocaste!");
                if (fuelBar) {
                    fuelBar.style.width = this.fuel + '%';
                    fuelBar.style.backgroundColor = this.fuel < 30 ? '#e74c3c' : '#2ecc71';
                }
            }
            draw() {
                if (ASSETS.helicopter.complete && ASSETS.helicopter.naturalWidth > 0) {
                    ctx.drawImage(ASSETS.helicopter, this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = '#f1c40f'; ctx.fillRect(this.x, this.y + 10, this.width, 10);
                    ctx.fillStyle = '#7f8c8d'; ctx.fillRect(this.x + 5, this.y + 22, this.width - 10, 3);
                }
                ctx.fillStyle = '#34495e';
                let rw = this.width * 0.9 * (0.5 + Math.sin(Date.now() * 0.1) * 0.5);
                let rx = this.x + (this.width * 0.65);
                ctx.fillRect(rx - rw / 2, this.y - 2, rw, 3);
                ctx.fillRect(rx - 2, this.y - 2, 4, 8);
                for (let i = 0; i < this.carryingCount; i++) {
                    ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(this.x + 10 + (i * 10), this.y + 35, 4, 0, Math.PI * 2); ctx.fill();
                }
            }
        }

        class Entity {
            constructor(x, y, w, h, type, vx = 0) {
                this.x = x; this.y = y; this.w = w; this.h = h; this.type = type;
                this.vx = vx; // Velocidad extra (para buitres)
            }
            update() { this.x -= (gameSpeed + this.vx); }
            draw() {
                ctx.save();
                if (this.type === 'CABLE') {
                    // Cuerpo del cable metálico (gradiente)
                    let grad = ctx.createLinearGradient(this.x, this.y, this.x + this.w, this.y);
                    grad.addColorStop(0, '#111');
                    grad.addColorStop(0.5, '#777');
                    grad.addColorStop(1, '#111');

                    ctx.fillStyle = grad;
                    ctx.fillRect(this.x, this.y, this.w, this.h);

                    // Reflejo de luz central
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(this.x + this.w / 3, this.y, this.w / 4, this.h);

                    // EFECTO ELÉCTRICO (Animado)
                    if (Math.random() > 0.8) {
                        ctx.strokeStyle = '#00f2fe';
                        ctx.lineWidth = 2;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#00f2fe';

                        let endY = (this.y === 0) ? this.h : this.y;
                        ctx.beginPath();
                        ctx.moveTo(this.x - 5, endY);
                        for (let i = 0; i < 3; i++) {
                            ctx.lineTo(this.x + Math.random() * 15 - 7, endY + Math.random() * 20 - 10);
                        }
                        ctx.stroke();

                        // Chispa central
                        ctx.fillStyle = 'white';
                        ctx.beginPath();
                        ctx.arc(this.x + this.w / 2, endY, 3 + Math.random() * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else {
                    const img = ASSETS[this.type.toLowerCase().split('_')[0]];
                    if (img && img.complete && img.naturalWidth > 0) {
                        ctx.drawImage(img, this.x, this.y, this.w, this.h);
                    } else {
                        ctx.fillStyle = this.type === 'BIRD' ? '#c0392b' : '#27ae60';
                        ctx.fillRect(this.x, this.y, this.w, this.h);
                    }
                }
                ctx.restore();
            }
        }

        function init() {
            fuelBar = document.getElementById('fuel-bar');
            distVal = document.getElementById('dist-val');
            rescVal = document.getElementById('resc-val');
            resize();
            helicopter = new Helicopter();
            window.addEventListener('mousedown', (e) => { if (gameState === STATE.PLAYING) helicopter.tap(); });
            window.addEventListener('touchstart', (e) => { if (gameState === STATE.PLAYING) { e.preventDefault(); helicopter.tap(); } }, { passive: false });
            const setupBtn = (id, fn) => {
                const btn = document.getElementById(id);
                const trigger = (e) => { e.preventDefault(); e.stopPropagation(); fn(); };
                btn.onclick = trigger; btn.ontouchstart = trigger;
            };
            setupBtn('start-btn', startGame);
            setupBtn('restart-btn', startGame);
            requestAnimationFrame(loop);
        }

        function resize() {
            const container = document.getElementById('game-container');
            if (container) {
                canvas.width = container.clientWidth || window.innerWidth;
                canvas.height = container.clientHeight || window.innerHeight;
            }
        }

        function startGame() {
            resize();
            score = 0; rescues = 0; frameCount = 0; gameSpeed = CFG.baseSpeed; entities = [];
            helicopter.reset();
            gameState = STATE.PLAYING;
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
        }

        function gameOver(msg) {
            gameState = STATE.GAMEOVER;
            document.getElementById('gameover-screen').classList.remove('hidden');
            document.getElementById('final-stats').innerHTML = `<p>${msg}</p><br><p>Distancia: ${Math.floor(score)}m</p><p>Rescates: ${rescues}</p>`;
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameState === STATE.PLAYING) {
                frameCount++; gameSpeed += CFG.speedInc; score += gameSpeed / 10;
                if (distVal) distVal.innerText = Math.floor(score);
                if (rescVal) rescVal.innerText = rescues;
                if (frameCount % 60 === 0) {
                    let rand = Math.random();
                    if (rand < 0.2) entities.push(new Entity(canvas.width, 50 + Math.random() * (canvas.height - 150), 20, 10, 'BIRD', 1.5));
                    else if (rand < 0.4) {
                        lastCablePos = lastCablePos === 0 ? 1 : 0;
                        let len = 100 + Math.random() * 200;
                        entities.push(new Entity(canvas.width, lastCablePos === 0 ? 0 : canvas.height - len, 4, len, 'CABLE'));
                    }
                    if (rand > 0.8 || helicopter.fuel < 40) {
                        let type;
                        if (helicopter.fuel < 40) {
                            type = 'FUEL_STATION';
                        } else {
                            const canRescue = helicopter.carryingCount < 3;
                            const hasPeople = helicopter.carryingCount > 0;

                            if (canRescue && hasPeople) {
                                // Si lleva gente pero aún tiene espacio, dar prioridad (75%) al hospital
                                type = Math.random() < 0.75 ? 'HOSPITAL' : 'ACCIDENT';
                            } else if (canRescue) {
                                // Si no lleva a nadie, solo soltar accidentes
                                type = 'ACCIDENT';
                            } else if (hasPeople) {
                                // Si está lleno, solo soltar hospitales
                                type = 'HOSPITAL';
                            } else {
                                // Por si acaso: si no puede ninguna de las dos, soltar fuel extra
                                type = 'FUEL_STATION';
                            }
                        }
                        entities.push(new Entity(canvas.width, (lastCablePos === 1 ? 0.2 : 0.6) * canvas.height + Math.random() * 50, 50, 20, type));
                    }
                }
                helicopter.update();
                for (let i = entities.length - 1; i >= 0; i--) {
                    let e = entities[i]; e.update(); e.draw();
                    if (helicopter.x < e.x + e.w && helicopter.x + helicopter.width > e.x && helicopter.y < e.y + e.h && helicopter.y + helicopter.height > e.y) {
                        if (e.type === 'BIRD' || e.type === 'CABLE') gameOver("¡Accidente!");
                        else if (e.type === 'FUEL_STATION' && helicopter.dy >= 0) { helicopter.fuel = Math.min(100, helicopter.fuel + CFG.fuelRefill); entities.splice(i, 1); }
                        else if (e.type === 'ACCIDENT' && helicopter.carryingCount < 3) { helicopter.carryingCount++; entities.splice(i, 1); }
                        else if (e.type === 'HOSPITAL' && helicopter.carryingCount > 0) { rescues += helicopter.carryingCount; helicopter.carryingCount = 0; entities.splice(i, 1); }
                    }
                    if (e.x + e.w < 0) entities.splice(i, 1);
                }
            }
            helicopter.draw();
            requestAnimationFrame(loop);
        }
        document.addEventListener('DOMContentLoaded', () => { init(); setTimeout(resize, 100); });
        window.onresize = resize;
    </script>
</body>


</html>
